apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: supek8smcp-servers
  namespace: supek8smcp-system
  labels:
    app.kubernetes.io/name: supek8smcp
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: supek8smcp-server
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
