apiVersion: apps/v1
kind: Deployment
metadata:
  name: supek8smcp-controller-manager
  namespace: supek8smcp-system
  labels:
    app.kubernetes.io/name: supek8smcp-operator
    app.kubernetes.io/part-of: supek8smcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supek8smcp-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supek8smcp-operator
        app.kubernetes.io/part-of: supek8smcp
    spec:
      serviceAccountName: supek8smcp-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/samuelsupe/supek8smcp:0.3.0
          imagePullPolicy: IfNotPresent
          args:
            - operator
            - --server-image=ghcr.io/samuelsupe/supek8smcp:0.3.0
            - --leader-elect=true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
