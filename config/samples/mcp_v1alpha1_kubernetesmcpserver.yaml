apiVersion: mcp.supek8smcp.io/v1alpha1
kind: KubernetesMCPServer
metadata:
  name: team-readonly
  # Create this dedicated namespace first and do not grant tenant Pod creation in it.
  namespace: supek8smcp-servers
spec:
  mode: ReadOnly
  scope:
    namespaces:
      - default
    allowClusterScopedRead: false
  policy:
    sensitiveReads: Redact
  networkPolicy:
    enabled: true
    allowedNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: default
