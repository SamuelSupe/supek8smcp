{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: supek8smcp-controller-manager-rolebinding
  labels:
    {{- include "supek8smcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: supek8smcp-controller-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "supek8smcp.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
